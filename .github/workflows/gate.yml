name: gate

# The publish gate is the control that stops client landmarks reaching a public repo.
# It only works if it actually RUNS — every gate failure in this repo's history was a
# check nobody ran, or one that ran and could not catch anything. So it runs here, on
# every change, as a required status check.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege. This workflow reads the tree and writes a job summary; it never needs
# to write to the repo, and it must never be given secrets that a fork PR could reach.
# NOTE: this is deliberately `pull_request`, NOT `pull_request_target`. The latter runs
# with repository secrets in the context of the base branch — combined with a checkout of
# the PR head, that hands write-scoped credentials to untrusted code. Do not change it.
permissions:
  contents: read

jobs:
  publish-gate:
    runs-on: ubuntu-latest
    env:
      # ⛔ THE INTERLOCK THAT STOPS COVERAGE SHRINKING SILENTLY AGAIN. Suites that can degrade
      # when a tool is missing REFUSE to degrade while this is set, instead of quietly
      # asserting less and reporting the same green. Installing the tool is what makes the
      # gate pass; if that step is ever removed, or the runner image stops shipping what a
      # suite needs, the gate goes RED and names the tool — rather than shrinking by 90% and
      # still ticking. Remove this only together with the suites that honour it.
      WT_TESTS_REQUIRE_FULL: "1"
      # Same interlock, different missing tool: three df-governed suites assert
      # `claude plugin validate` and skipped it on every run before 2026-10-05, because the
      # runner ships no claude CLI. ⚠️ TWO NAMES FOR ONE IDEA IS A WART — `WT_` is the
      # walkthrough's ffmpeg/sox interlock and this is the repo-wide one. They should converge
      # on `DF_TESTS_REQUIRE_FULL`; left as a follow-up rather than renaming a variable that
      # PR #226 is mid-review on, because a silent rename is how a honoured interlock stops
      # being honoured. Whoever converges them: grep both names, expect 8 sites.
      DF_TESTS_REQUIRE_FULL: "1"
    steps:
      - name: Checkout (full history — P8 scans every blob ever committed)
        # Pinned to a commit SHA, not a tag: a tag is mutable and can be repointed at
        # new code by anyone who controls the action's repo.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg — WITHOUT IT FOUR SUITES SILENTLY SHRINK
        # ⛔ MEASURED 2026-10-05, AND IT IS THE REASON THIS STEP EXISTS. The runner image has
        # no ffmpeg, so `df-app-walkthrough`'s artefact suites took their degraded paths and
        # the run was GREEN at a fraction of the coverage: verify 20 -> 2 assertions,
        # assemble 26 -> 2, stages 39 -> 21, mutations 36 -> 21. Among the 15 mutants that did
        # not run was `the #224 black-frame defect, restored` — the regression guard for a
        # defect that actually shipped. It was guarded on a maintainer's laptop and nowhere
        # that enforces anything.
        #
        # ⚠️ AND THE SHRINKAGE WAS INVISIBLE. Each suite prints a `COVERAGE:` line naming what
        # it skipped, but `run-tests.sh` captures child output and shows it only on FAILURE —
        # so on a pass the declaration never reaches the log. The only visible signal was the
        # assertion count, and a reader would have to already know the full number to notice.
        # A suite that quietly measures less on the machine that gates merges is the same
        # defect this repo keeps finding, one layer out: a check decaying with no signal.
        #
        # sox is deliberately NOT installed. The suites stub it (it is absent on plenty of
        # machines), and one case asserts the behaviour when sox is missing — with a scoped
        # PATH, so it holds either way.
        # ⚠️ The last line is an ASSERTION, not an echo. GitHub runs `run:` under `bash -e`, so
        # a `grep -c` finding zero exits 1 and fails this step — which is what we want: an
        # ffmpeg built without libass has no `subtitles` filter, `assemble.mjs` cannot burn
        # captions in, and the suites that cover it would pass against a tool that can never
        # do the job. Fail here, where the message is one line, not three steps later.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -c ' subtitles '

      - name: Install the claude CLI — WITHOUT IT THE PLUGIN MANIFEST IS NEVER VALIDATED
        # ⛔ MEASURED 2026-10-05 on gate run 37337141934, and the reason this step exists.
        # `ubuntu-latest` ships no claude CLI, so three df-governed suites took their skip
        # path on EVERY run and `claude plugin validate` had never once executed where it
        # gates a merge: test-escalation-gate (-2 assertions), test-mission-tick (-1),
        # test-plugin-invariants (-1). Local 3634 vs CI 3629 — both green, five apart.
        #
        # ⚠️ The skips were HONEST and still invisible: test-plugin-invariants' own SKIP text
        # says "a run without the CLI has NOT proven I5", but `run-tests.sh` shows a child's
        # output only on FAILURE, so it never reached the log. A declaration is not a control.
        #
        # ⚠️ NO CREDENTIAL IS NEEDED AND THAT IS LOAD-BEARING: `claude plugin validate` is
        # static validation of .claude-plugin/plugin.json. Measured with an empty $HOME, no
        # ANTHROPIC_API_KEY and a stripped environment — it printed "Validation passed". So
        # this step adds no secret to the workflow, which matters because the job above is
        # deliberately `pull_request` and must stay reachable by fork PRs.
        #
        # Pinned, not floating: an unpinned global install lets a new upstream release change
        # what this gate does without a commit here. Bump it deliberately.
        # ⚠️ The last line is an ASSERTION, not an echo — `run:` is `bash -e`, so if the CLI
        # is absent or broken this step fails here, with a one-line message, instead of three
        # steps later as a REFUSING TO DEGRADE from each suite.
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.289
          claude --version

      - name: Self-test — prove every pattern class can FAIL
        # Runs FIRST and on purpose. A gate that passes proves nothing until you have
        # seen it fail on an input it must catch; this plants a canary per class and
        # asserts the gate rejects each one. If this step passes but the gate below
        # cannot catch anything, the patterns have gone inert.
        run: bash boot-kit/scripts/gate-selftest.sh

      - name: Test suites — EVERY suite in the repo, discovered by existence
        # This step used to name ONE suite (`tests/test-p8-reachability.sh`). The repo
        # ships two dozen across four directories, so all but that one ran only when a human typed the
        # path — correctness maintained by memory, decaying silently, green-looking
        # because absence has no signal. `run-tests.sh` globs instead, so a suite is
        # enrolled by being COMMITTED rather than by someone remembering to edit this
        # file. That matters here specifically: the ticket that filed this finding
        # enumerated the suites by hand and its list was already wrong.
        #
        # Measured 73s for a full pass on an M-series laptop, the bulk of it
        # `test-gate-selftest.sh` (20s) and `test-source-resolution.sh` (10s). Well
        # inside the range where a required check does not get bypassed for being slow.
        #
        # P8 reachability is one of them and still runs: it plants a committed canary
        # per class in a scratch repo under TMPDIR, never in this checkout, because a
        # test that proved P8 by committing a landmark here would create the exact
        # condition P8 exists to detect.
        run: bash boot-kit/scripts/run-tests.sh

      - name: Tier-1 genericity — is the method repo actually generic?
        # The property every other gate assumes and none checks. `tier-check.py` asks
        # whether a LOWER tier reaches up; nothing asked whether Tier 1 is estate-neutral,
        # and by 2026-08-30 the public "generic method" listed a Supabase branch, a
        # RabbitMQ instance and a DigitalOcean app as prerequisites.
        #
        # ⚠️ UNLIKE THE PUBLISH GATE BELOW, THIS ONE RUNS AT FULL STRENGTH HERE. Its
        # vocabulary (`tier1-generic.conf`) is committed, because no product name in it is
        # secret — where `landmarks.conf` must be gitignored and CI is left running
        # placeholders (ticket 12915091248). So a green tick on this step means what it
        # says, and that difference is the reason the config was designed to ship.
        run: python3 boot-kit/scripts/tier1-generic.py

      - name: Publish gate — PLACEHOLDER patterns only, not a real-landmark pass
        # The step NAME carries the caveat because that is what a reader skimming a green
        # check actually sees. The job summary below says the same thing at length, and
        # CONTRIBUTING.md a third time — but a caveat that only exists one expand-click
        # away from the green tick is a caveat most readers will never meet.
        run: bash boot-kit/scripts/publish-gate.sh --history

      - name: Report which landmark config was used
        # THIS IS NOT COSMETIC. `landmarks.conf` holds the real patterns and is
        # gitignored — it is the list of nouns that must not be published, so committing
        # it would publish exactly what the gate protects. CI therefore runs against
        # `landmarks.example.conf`, whose patterns match FICTIONAL companies.
        #
        # Consequence: a green check here proves the gate is well-formed, that no pattern
        # is inert, and that no placeholder landmark leaked. It does NOT prove the branch
        # is free of REAL landmarks. Only a maintainer running the gate locally with
        # landmarks.conf can prove that, and CONTRIBUTING.md says so.
        #
        # We surface it rather than hiding it, because a check that looks stronger than
        # it is is worse than no check.
        if: always()
        run: |
          CONF=$(bash boot-kit/scripts/publish-gate.sh 2>&1 | head -1)
          echo "### Gate configuration" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$CONF" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          case "$CONF" in
            *PLACEHOLDER*)
              echo ':warning: **CI ran with PLACEHOLDER patterns.** This proves the gate is' >> "$GITHUB_STEP_SUMMARY"
              echo 'well-formed and that no class is inert. It does **not** prove this branch is' >> "$GITHUB_STEP_SUMMARY"
              echo 'free of real landmarks — `landmarks.conf` is gitignored and unavailable here.' >> "$GITHUB_STEP_SUMMARY"
              echo 'A maintainer must run `bash boot-kit/scripts/publish-gate.sh --history` locally,' >> "$GITHUB_STEP_SUMMARY"
              echo 'with the real `landmarks.conf` present, before merging.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo 'Gate ran with a real landmark config.' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
