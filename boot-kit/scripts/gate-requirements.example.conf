# gate-requirements.example.conf — the POLICY side of the publish gate.
#
# publish-gate.sh scans for the patterns landmarks.conf HAS. This file names the landmark
# classes your publishing rules SAY must never ship, so the two can be compared. A class
# listed here with no matching pattern shows up as MISSED — which is the one failure a
# self-test built from landmarks.conf's own canaries can never surface.
#
# Copy to `gate-requirements.conf` (gitignored) and replace each placeholder with a REAL
# specimen of that class from your estate. Placeholders measure nothing, so gate-reqtest.sh
# refuses to report a result while running against this file.
#
# Format, one class per line:   <class name> | <expected P-class> | <specimen>
# or, for a class you deliberately do NOT pattern:
#                               <class name> | EXEMPT | <specimen> | <reason>
#
# EXEMPT exists because some classes are deliberately left uncovered, and a tool that
# reports a decision as a defect gets its bottom line ignored — taking the real gaps with
# it. Two cases that come up immediately:
#   * your own company name — a pattern for it fires on your LICENSE and NOTICE;
#   * a library or product name that is an ordinary word or a widely-used open-source
#     project ("fulcrum", "argus") — a pattern for it fires on ordinary prose.
# An ignored gate is worse than no gate, and firing on legitimate text is how gates get
# ignored. Marking the class EXEMPT records the decision where the next reader will find
# it, instead of leaving a MISSED row that looks like nobody noticed.
#
# The reason is not decoration: an exemption with no stated reason is indistinguishable
# from an oversight somebody wrote down, so gate-reqtest.sh treats a missing one as a
# disagreement to reconcile. An EXEMPT class whose specimen DOES fire is also reported —
# policy and config are then out of step, and an exemption must never swallow a firing.
#
# The classes below are the ones this project's publishing rules name. Yours may differ —
# derive them from your own rules, not from this list, or you inherit someone else's gaps.

REQUIREMENTS="
client name                     |P1|<A-CLIENT-NAME>
private repo name               |P1|<A-PRIVATE-REPO-NAME>
private library or product name |P1|<AN-INTERNAL-LIBRARY-NAME>
private org name                |P1|<YOUR-GIT-ORG>
private org/repo                |P1|<YOUR-GIT-ORG>/<A-PRIVATE-REPO-NAME>
project or programme code       |P1|<AN-INTERNAL-PROJECT-CODE>
second-estate landmark          |P3|<A-CLUSTER-OR-SERVICE-FROM-THE-OTHER-ESTATE>
cluster name                    |P4|<A-CLUSTER-NAME>
internal URL                    |P4|<AN-INTERNAL-HOSTNAME-OR-PATH>
tracker board id                |P7|<A-BARE-TRACKER-BOARD-ID>
person                          |P6|<A-PERSONAL-EMAIL-OR-HOME-PATH>
company name                    |EXEMPT|<YOUR-COMPANY-NAME>|<WHY-YOU-DO-NOT-PATTERN-IT>
"
