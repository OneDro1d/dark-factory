# landmarks.example.conf — the patterns publish-gate.sh scans for.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS SEPARATE FROM THE GATE
# ---------------------------------------------------------------------------
# A landmark list is, by construction, a list of the exact nouns you do not want
# published: client names, cluster hostnames, registry names, database project
# ids. Embedding it in the gate script means that publishing the gate publishes
# the directory of everything it was built to protect.
#
# That is not hypothetical. This repo shipped its first public build with the
# real patterns inline, and an independent blob-level scan of the history caught
# it — the gate excludes itself from its own scan (it has to, or it would always
# match), so the gate could never have reported this. A tool cannot audit itself.
#
# So: the LOGIC is public and the LIST is local.
#
# ---------------------------------------------------------------------------
# USING IT
# ---------------------------------------------------------------------------
#   cp landmarks.example.conf landmarks.conf     # then edit landmarks.conf
#
# `landmarks.conf` is gitignored. publish-gate.sh loads it when present and
# falls back to this example file when it is not — and SAYS which one it used,
# because a gate running on placeholder patterns looks identical to a gate
# running on real ones unless it tells you.
#
# In a multi-tier setup, keep the real landmarks.conf in the private
# organisation repo and symlink or copy it in.
#
# ---------------------------------------------------------------------------
# WRITING PATTERNS
# ---------------------------------------------------------------------------
# These are POSIX ERE, consumed by `git grep -E`. Two rules learned the hard way:
#
#   1. NEVER use `\b`. git grep -E has no PCRE: `\b` compiles without error and
#      matches ZERO lines. Use `(^|[^A-Za-z])word($|[^A-Za-z])` instead. Note
#      that plain BSD/GNU `grep -E` DOES honour `\b`, so a pattern you test with
#      grep will look correct and then silently scan nothing here.
#
#   2. Match LANDMARKS, not VOCABULARY. A landmark is a noun that can only have
#      come from one estate. Public standards, regulatory nouns and industry
#      terms are vocabulary and belong in your docs. A gate that cries wolf gets
#      ignored, and an ignored gate is worse than no gate.
#
# After editing, PROVE EACH PATTERN FIRES. Put a string it must catch into a
# scratch file and confirm the gate fails. A pattern you have only seen pass is
# a pattern you have not tested.

# Client / programme landmarks — names, internal project codes, ticket prefixes.
# Replace with your own. Examples are deliberately fictional.
#
# COVER FOUR SHAPES, not one. A real config here scanned for the client's ticket prefix and
# one repo name, then PASSED on the line "ESO Catalyst / ESO Suite / an ESO production
# estate" — three landmarks, none matched, because only the shapes someone had already
# thought of were listed. The four that keep recurring:
#   1. the programme / product name, including MULTIWORD forms ("Acme Health Suite")
#   2. the repo-name PREFIX the estate uses ("acmehealth-" on every repo)
#   3. the GitHub org and any estate hostname ("acme-health-dev", "acmehealth.net")
#   4. the ticket prefix
# A single ambiguous word (an acronym that is also an industry term) stays OUT — the
# multiword form disambiguates it. An ignored gate is worse than no gate.
#
# SHAPE 5, added 2026-08-25: the product name ON ITS OWN, even when it is an ordinary
# English word. A real config listed `acmehealth-` as a repo prefix and the multiword
# suite name, and still passed on the plain sentence "the 10 prime directives for all
# Redcedar work" — the estate name, unqualified, in the middle of prose.
#
# The tempting fix is to require a qualifier (`Redcedar work|Redcedar suite|the Redcedar
# team`). Do not: an enumeration of qualifiers is the same defect as an enumeration of
# shapes — it matches what you remembered, and the next sentence uses a word you did not.
# Match the name bare and accept the occasional false positive on English prose, WHICH
# YOU SHOULD MEASURE FIRST: grep your own repo for the word before adding it. If it turns
# up dozens of legitimate uses the name is genuinely too common and belongs in the
# requirement list as an EXEMPT class WITH A REASON, not silently omitted.
#
# NOT A CASE PROBLEM. publish-gate.sh scans with `git grep -E -i`, so a pattern written in
# lower case already matches the capitalised noun. An audit once attributed a miss to
# case-sensitivity and proposed re-casing three patterns; it had probed them with plain
# `grep -E` rather than through the gate, and the real cause was an absent branch. Test a
# pattern by running THE GATE, never by re-implementing the scan.
P1_PATTERN='ACME-HEALTH|acmehealth|acmehealth-[a-z]|acme-health-dev|Acme Health Suite|(^|[^A-Za-z])redcedar($|[^A-Za-z])|proj-redcedar|AH-[0-9]{3,}'

# Concrete markers of regulated data. Match the concrete field, not the
# regulatory noun — "HIPAA" in a design doc is teaching, `patient_id` is a leak.
P2_PATTERN='patient_id|(^|[^A-Za-z])mrn($|[^A-Za-z])|protected health information'

# A second client / estate, if you serve more than one.
P3_PATTERN='(^|[^A-Za-z])northwind($|[^A-Za-z])|northwind-trading|nw-prod-db'

# Private infrastructure identifiers — registries, clusters, cloud account ARNs,
# managed-database project ids, and SECRET STORES.
#
# The secret store was added 2026-08-25 after a named key vault matched no class at all.
# The cluster it lived beside was patterned and the vault next to it was not, because the
# requirement list had a row for `cluster name` and no row for a secret store — a class
# nobody listed cannot be missed by a checker, it is simply never asked about. When you
# add an infrastructure class, ask what sits BESIDE it in your own architecture diagram.
#
# Pattern the vendor DNS SUFFIX as well as your own resource name. The suffix keeps
# matching after somebody renames the vault, which the resource name does not.
#
# THE BARE UUID BRANCH is the one shape in this class that needs no org name at all, which
# is what makes it worth having: it is the only P4 branch that keeps working in CI, where
# the real config is absent and this example runs in its place. A tenant id, an Azure
# subscription, a Jira workspace, a board id — all of them are 8-4-4-4-12 hex, and all of
# them identify an estate to anyone who reads them.
#
# It is NOT the cry-wolf machine that `[0-9]{10,}` was. Measured before it was added:
# ZERO matches across this entire repository, and it caught both known positives in the
# reference estate on the first try (a Jira workspace id appearing twice in one skill, and
# an Atlassian tenant id in a session hook). A UUID is structured enough that prose does
# not produce one by accident, which is exactly what a bare digit run cannot claim.
P4_PATTERN='myorgregistry|registry\.internal\.example|prod-euwest-aks|kv-myorg[a-z0-9-]*|\.vault\.azure\.net|arn:aws:|[0-9]{12}\.dkr\.ecr|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

# Secret-shaped strings. These are format-based, not org-specific, so the
# default is usually right as-is.
P5_PATTERN='gh[pousr]_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-|^[[:space:]]*-----BEGIN [A-Z ]*PRIVATE KEY|Authorization: *Bearer +[A-Za-z0-9._-]{20,}|AKIA[0-9A-Z]{16}'

# Personal and machine-local identifiers — home paths, maintainer addresses.
P6_PATTERN='/Users/[a-z]+/|/home/[a-z]+/|@example-corp\.com'

# Internal trackers and boards — board ids, workspace ids, ticket URLs.
#
# Match tracker URL SHAPES, not bare digit runs. `[0-9]{10,}` looks reasonable and is a
# cry-wolf machine: it matches timestamps (`touch -t 200001010000`), digit runs inside
# synthetic test tokens, checksums and epoch values. It produced four false positives the
# first time this config ran in CI. An ignored gate is worse than no gate.
# Cover the WIKI as well as the issue tracker, and the estate's own citation shorthand.
# A real config here had `monday`/`notion` but neither `atlassian.net/wiki` nor the bare
# `Confluence <page-id>` form the docs actually used — six such citations sat in files
# queued for publication. The two configs disagreeing about what a landmark is has now
# twice been the thing that found a hole; keep them in step deliberately.
P7_PATTERN='atlassian\.net/(browse|wiki)|Confluence +[0-9]{9,}|\.monday\.com/boards/[0-9]+|notion\.so/[0-9a-f]{32}'

# Files exempt from P5 only: files whose JOB is to contain secret-shaped strings.
# The redaction tests and fixture must carry things that LOOK like credentials, or the
# tests prove nothing — deleting the vectors would delete the proof that redaction works.
#
# EXPLICIT PATHS, never a wildcard. A `tests/` wildcard would let a real credential
# dropped into any test directory sail straight through. Named files can be eyeballed on
# review; a pattern cannot.
P5_EXCLUDE=':!skills/handoff-auto/tests/test_pre_compact.sh
:!skills/handoff-auto/tests/test_redact.sh
:!skills/handoff-auto/tests/test_session_start.sh
:!skills/handoff-auto/fixtures/transcript.jsonl'

# Files exempt from P6 only:
#   - SECURITY.md and CODE_OF_CONDUCT.md must publish a contact address, or the project
#     has no disclosure path at all — a worse failure than the one P6 defends against.
#   - the redaction fixture carries SYNTHETIC home paths on purpose: they are the input
#     the redactor is tested against.
P6_EXCLUDE=':!SECURITY.md
:!CODE_OF_CONDUCT.md
:!skills/handoff-auto/fixtures/transcript.jsonl'

# ---------------------------------------------------------------------------
# CANARIES — one known-positive string per class
# ---------------------------------------------------------------------------
# gate-selftest.sh plants each of these and asserts the gate FAILS on it. Every
# gate bug this method has seen was a check that reported PASS while unable to
# catch anything; the canary is what makes that impossible to miss.
#
# They live HERE rather than in the self-test script for the same reason the
# patterns do: a canary is by definition a string your patterns must match, so
# hardcoding real ones in a committed script publishes the exact nouns you are
# hiding. Keep real canaries in landmarks.conf.
#
# If you add a pattern, add its canary. If you cannot write a canary for a
# pattern, you do not yet know what that pattern is for.
# One canary per PATTERN is the floor; one per BRANCH is the bar. A four-branch P1 with a
# single canary proves one branch works and says nothing about the other three — which is
# exactly how the multiword and repo-prefix branches came to be missing without anyone
# noticing. If you cannot write a canary for a branch, you do not yet know what it is for.
#
# You do not have to guess how close you are. `gate-selftest.sh` prints the pinned-branch
# count per class and on its verdict line, and `gate-selftest.sh --show` names the branches
# no canary reaches. Treat that number as a reading, not a target: one canary per branch is
# a list that rots, and deriving a canary FROM each branch proves only that the config
# agrees with itself. The number is there so a green stops meaning more than it earned.
P1_CANARY='ACME-HEALTH intake record'
P1_CANARY_ORG='the Acme Health Suite production estate'
P1_CANARY_REPO='acmehealth-registry-tool'
P1_CANARY_GH='github.com/acme-health-dev/something'
# One canary PER BRANCH, including every branch added later. A branch you have only ever
# seen pass is a branch you have not tested, and gate-selftest counts an unpinned branch
# against you on its summary line precisely so a new one cannot be added quietly.
P1_CANARY_BARE='the 10 prime directives for all Redcedar work'
P4_CANARY_VAULT='kv-myorg-euwest-01 holds the signing key'
P4_CANARY_VAULTDNS='https://example-store.vault.azure.net/secrets/x'
# Synthetic, and deliberately not a v4 UUID any tool would mint: every group is the same
# repeated hex digit. It has to MATCH the shape without being mistakable for a real id if
# somebody greps this file looking for one.
P4_CANARY_UUID='workspace 11111111-2222-3333-4444-555555555555'
P2_CANARY='patient_id column'
P3_CANARY='northwind-trading service'
P4_CANARY='myorgregistry/some-image:latest'
P5_CANARY='AKIAABCDEFGHIJKLMNOP'
P6_CANARY='/Users/someone/workspace'
P7_CANARY='https://example.monday.com/boards/12345'
P7_CANARY_WIKI='see Confluence 1234567890 for the source'

# -- P8 waivers: already-published landmarks reviewed and accepted -------------
# P8 scans git HISTORY. Its remedy for an already-published landmark is to rebuild the
# repo from a fresh git init, because the objects stay fetchable by SHA and a force-push
# will not undo that. That is right for a real client leak and disproportionate for a
# finding that, on review, discloses nothing. A gate whose only prescription is the
# nuclear option is one people learn to bypass -- and the bypass is what waves the next
# real finding through. So a reviewed finding can be accepted here, explicitly.
#
# Format: <matched-token><whitespace><reason>. Both are required; an unexplained waiver
# is indistinguishable from a mistake six months later and is refused at runtime.
#
# Keyed on the matched TOKEN, never a file or a commit. A new landmark in the same file
# is a different token and still fails hard. A waiver that matches nothing is reported
# as stale, because it would otherwise silently cover that token's later arrival.
#
# A waived finding still prints, every run. Waiving is not silencing.
# WARNING, learned the hard way 2026-08-25: this block is SINGLE-QUOTED, so a reason may
# not contain an apostrophe. One terminates the string and silently truncates every waiver
# after it. The gate does not error - it reads a short or empty list and reports waived
# tokens as unwaived. It fails SAFE (nothing is wrongly accepted) and it fails QUIET, which
# is the half that costs you an hour. Keep reasons apostrophe-free.
P8_WAIVED='
'
