# tier1-generic-allow.conf — recorded exceptions to the Tier-1 genericity gate.
#
# FORMAT: `path :: reason, and what unblocks it`. The reason is not optional — an entry
# with no reason is reported as a defect, and so is an entry for an artifact that is now
# clean or gone. Same contract as `lock-verify` L9's `install.hooksUnwired`, for the same
# reason: a gate with an anonymous mute button becomes a gate people learn to ignore, and
# this repo has already shipped one that could not fail.
#
# ⚠️ WHAT THIS FILE IS NOT. It is not "the findings we disagree with". Every entry below is
# a REAL finding that this gate is right about. Six of the seven are open defects the gate
# is now the standing record of; the seventh pair is the honest documentation of one of
# them. Nothing here is a false positive — a false positive is a bug in the gate, and the
# fix for a bug in the gate is to fix the gate.
#
# ⚠️ AND THE FILE STARTING NON-EMPTY IS THE POINT, not an embarrassment. The alternative
# was to ship the gate only once Tier 1 was clean, which would have meant not shipping it:
# the biggest offender cannot be fixed without a promotion that is itself blocked. A gate
# that fails loudly on the NEXT one, with today's offenders named and dated, beats a gate
# that never lands.

# --- the family F-01 is about, and the reason it cannot be fixed here -----------------
# T1's develop-and-test lists a Supabase branch, a RabbitMQ instance and a DigitalOcean app
# as PREREQUISITES and tells the reader to run `pnpm build:shared` and wire Fastify. The
# fix is not an edit: the portable text already exists as the Tier-2 "fork", so the repair
# is a T2 -> T1 body swap. That is a PROMOTION into a public repo, which is blocked twice
# over — on the operator's IP decision, and on ticket 12915091248 (the publish gate runs
# `landmarks.example.conf` in CI and cannot see a real landmark). Unblocks with those.
skills/develop-and-test/SKILL.md :: F-01. Fix is a T2->T1 body swap = a promotion; blocked on the operator IP call and ticket 12915091248.

# The same family's template, and it was NOT named in F-01 — found by this gate on its
# first run. It is as coupled as the skill the whole finding was written about: rabbitmq x9
# across four categories. Same blocker, same unblock.
skills/requirements-discovery/REQUIREMENTS-TEMPLATE.md :: F-01's family, missed by the read that produced F-01. Same T2->T1 promotion, same two blockers.

# --- ✅ service-mapper/SKILL.md: EXCEPTION DELETED 2026-08-31, the gate was fixed ------
# This file used to carry a long entry for `skills/service-mapper/SKILL.md`, recorded as a
# FALSE POSITIVE of the category heuristic and saying, in as many words, that "the fix
# belongs in the gate". It does, and it landed: the gate now judges a PROSE BLOCK rather
# than a whole file, so a catalogue — one concern per table row, alternatives inside the
# row, grep recipes in fenced blocks — is no longer read as one estate's stack. The file
# passes on its own merits and needs no entry.
#
# ⚠️ Kept as a comment rather than deleted outright, because the entry's own reason was
# INCOMPLETE and that is worth more than the entry was. It said "a menu of alternatives
# across two concerns (brokers, ORMs)". Measured: three categories, and the third was
# `supabase` in `DATABASE_URL, SUPABASE_URL, MONGO_URI` — a menu of DATABASES, invisible to
# a reader who only listed the two concerns they had noticed. A reason written from a
# partial read is what an exception looks like when it is about to outlive its truth.

# --- the honest record of the defect, which must not be punished ----------------------
# These two do not USE the stack — they NAME it, verbatim, as the documented reason
# develop-and-test is excluded from every kit. Failing them would mean the gate penalises
# writing the defect down, and the next author's cheapest way to green would be to delete
# the explanation. That is the opposite of what this gate is for. These entries go stale
# and must be deleted the day develop-and-test is fixed, which is what STALE detection is
# for: the exception cannot outlive the thing it explains.
kits/README.md :: Quotes the develop-and-test coupling as the documented reason that skill is in no kit. Delete this entry when that skill is fixed.
kits/method-core/kit.json :: Same quotation, in the $excluded rationale. Delete this entry when develop-and-test is fixed.
