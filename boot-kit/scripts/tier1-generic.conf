# tier1-generic.conf — the estate-stack vocabulary the Tier-1 genericity gate scans for.
#
# ⚠️ THIS FILE SHIPS, AND THAT IS THE POINT. Compare `landmarks.conf`, which is gitignored
# because it holds real client names — with the consequence that CI runs the placeholder
# copy and the publish gate is blind to real names (ticket 12915091248). Nothing here is
# secret: "Supabase" and "RabbitMQ" are public product names. So this gate runs at full
# strength in CI, on the first run, with no local configuration. A gate whose real config
# cannot ship is a gate that does not run.
#
# FORMAT: `[category]` headers, one product token per line, `#` comments. Matched
# case-insensitively on a word boundary.
#
# ⚠️ THE CATEGORIES ARE LOAD-BEARING, NOT DECORATION. The gate counts distinct CATEGORIES,
# never distinct products, and the difference was measured rather than guessed. Two products
# from ONE category is how a generic document names alternatives — `Database queries
# (Prisma, Drizzle, etc.)` in `vercel-react-best-practices` is the generic phrasing, and a
# product-count rule failed it. Products from TWO OR MORE categories is a stack: nobody
# writes "Supabase and RabbitMQ and Fastify" as a menu, they write it because that is what
# they run. Counting products punishes the generic phrasing and counting categories does not.
#
# WHAT BELONGS HERE: a named third-party product, platform or in-house service that ONE
# estate happens to have chosen. Not a language, not a protocol, not a general technique —
# "Postgres" and "HTTP" and "unit test" describe the world, while "Supabase" describes a
# purchasing decision. The test for adding a token: would a company doing the same work with
# different vendors be confused to find this in a repo that calls itself the method?
#
# ⚠️ `amqp` was in the first draft of this file and was REMOVED by that test: it is a
# protocol, like HTTP, and every artifact naming RabbitMQ named it too — inflating the count
# with a second token for one decision. The file was breaking its own rule on its first day.

[managed-platform]
supabase
digitalocean
vercel
netlify
render.com
fly.io

[broker]
rabbitmq
kafka
sqs
nats

[app-framework]
fastify
nestjs
prisma
drizzle
pnpm

[auth]
clerk
auth0

[observability]
betterstack
sentry
datadog

[market-data]
coingecko
binance

# ⚠️ These are OURS, which makes them easier to miss and no less coupling. A public method
# repo that assumes the reader runs our memory service is exactly as estate-specific as one
# that assumes they run Supabase. They are listed last because they are the ones a reader
# from this estate will instinctively defend.
[in-house]
engram
synapse
mempalace
trilix

# ⚠️ WHAT IS DELIBERATELY MISSING, AND THE LIMIT IT MARKS ------------------------------
# The first draft of this file also listed three estate-owned library and venue names. The
# publish gate rejected it — two tripped P1 (client landmarks) and one tripped P3
# (second-estate). It was right, and the claim that "this vocabulary ships because nothing
# in it is secret" was true only of the third-party half.
#
# It rejected the FIX as well, when that was first written: an explanation naming the three
# tokens it had just removed published them just as effectively as the list had. Hence the
# wording here. A gate's vocabulary is built out of the exact strings it forbids, so it is
# textually indistinguishable from a violation — and so is any note explaining it. That is
# the same fact that gitignores `landmarks.conf`, arriving from the other direction, twice.
#
# So the split is now explicit, and so is what it costs:
#   THIS FILE          public third-party products. Ships, and runs at full strength in CI.
#   tier1-generic.local.conf   estate-private product names. Gitignored; read when present.
#
# ⚠️ Consequence, stated rather than buried: for the ESTATE-PRIVATE class this gate has the
# same blindness the publish gate has for real landmarks (ticket 12915091248) — CI cannot
# see those tokens. For the third-party class, which is where every finding so far has come
# from, it sees everything. Do not read a green CI tick as "no in-house coupling"; run it
# locally with the overlay for that.
