# substrate-denylist.example.conf — the SOURCE PROJECT's own identifiers, for VR2.
#
# VR2 in verify-substrate.sh asks one question: did anything from the project this
# substrate was extracted FROM survive into the emitted template? Answering it requires
# that project's real nouns, and those are exactly the strings that must not be committed
# to a public repo — so they live here, locally, and this committed file holds only the
# shape. Same split as landmarks.conf / landmarks.example.conf one directory up.
#
#   cp substrate-denylist.example.conf substrate-denylist.conf
#   then replace the placeholders with your own. The .conf name is gitignored.
#
# Format: ONE line, a POSIX ERE, alternated with `|`. First non-comment line wins.
# `grep -E` under `-i`, so write it lower case. Do NOT use `\b` — git grep -E has no PCRE
# and `\b` compiles fine while matching nothing, which is an inert check reporting green.
#
# COVER THE FAMILIES, not the individual names you happen to remember:
#   1. the service-name family        acme-(ingest|parser|portal|sidecar)
#   2. column and field names         tenant_scope_id|acme_case_ref
#   3. record-type SPELLINGS          Acme[a-z]Record   — the variants, not one literal
#   4. the estate or programme name   (^|[^a-z])redcedar($|[^a-z])
#
# Home paths are NOT your job: verify-substrate.sh always scans for those inline, with no
# configuration, because they are universal rather than project-specific.
acme-(ingest|parser|portal|sidecar|validator)|tenant_scope_id|acme_case_ref|Acme[a-z]Record|(^|[^a-z])redcedar($|[^a-z])
