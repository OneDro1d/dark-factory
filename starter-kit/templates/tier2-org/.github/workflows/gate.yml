name: gate

# WHY THIS FILE EXISTS. Until it landed, this repository had no `.github/` directory at
# all. That matters more here than in a leaf repo: this is the Tier 2 org layer, so
# `org.lock.json` is the single register that decides what every minted OneDroid Tier 3
# instance installs, and `scripts/new-instance.sh` stamps `templates/tier3-instance/` out
# verbatim. A defect landed here reaches the whole fleet on the next mint — and it was the
# one tier in the estate with nothing checking it.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow reads the tree and runs shell tests. It never writes to
# the repo. Deliberately `pull_request`, NOT `pull_request_target` — the latter runs with
# repository secrets against the base branch and, combined with a checkout of the PR head,
# hands write-scoped credentials to untrusted code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a commit SHA, not a tag: a tag is mutable and can be repointed at new
        # code by whoever controls the action's repo.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tier 1, for the template pin check
        # test-tier3-template-pin.sh compares templates/tier3-instance/ against Tier 1's
        # template AT THE PINNED COMMIT. It never fetches on its own: a test that quietly
        # clones is a test whose dependency nobody can see in the workflow that runs it.
        # So the checkout is HERE, in the open, and the path is handed over explicitly.
        # That suite asserts this step's existence by NAME (W1) — remove it and the gate
        # goes red rather than quietly ceasing to compare anything.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OneDro1d/dark-factory
          path: .tier1
          # The pin is a commit this layer declares, which may be well behind main. Full
          # history rather than the shallow default, or it may simply not be there.
          fetch-depth: 0
          persist-credentials: false

      - name: Test suites — EVERY suite in the repo, discovered by existence
        env:
          DF_T1_DIR: ${{ github.workspace }}/.tier1
        # `run-tests.sh` globs `test-*.sh`; a suite is enrolled by being COMMITTED, not by
        # anyone remembering to edit this file. Tier 1 learned that the expensive way: its
        # workflow named ONE suite while the repo shipped 22, and the ticket that filed the
        # finding enumerated them BY HAND and was already wrong.
        #
        # Three failure modes the runner is built to refuse, each of which would restore
        # the original defect while looking like a fix:
        #   · a hand-written suite list (rots silently)
        #   · exit status taken from the LAST child (an early failure then a pass exits 0)
        #   · a glob matching nothing (exits 0 — "no suites" is a hard failure here)
        run: bash scripts/run-tests.sh
